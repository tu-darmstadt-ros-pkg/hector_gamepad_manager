axes:
  0: # Left joystick left/right
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_left_right

  1: # Left joystick up/down
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_up_down

  2: # LT
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_backward

  3: # Right joystick left/right
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_yaw

  4: # Right joystick up/down
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_pitch

  5: # RT
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_forward

  6: # Cross right/left
    plugin: ''
    function: ''

  7: # Cross up/down
    plugin: ''
    function: ''

buttons:
  0: # Button A
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: nullspace_mode

  1: # Button B
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: hold_mode

  2: # Button X
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: gripper_close

  3: # Button Y
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: gripper_open

  4: # Button LB
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_roll_counter_clockwise

  5: # Button RB
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_roll_clockwise

  6: # Button Back
    plugin: ''
    function: ''

  7: # Button Start
    plugin: ''
    function: ''

  8: # Button Guide (Manufacturer Button) - fallback for pads without a Share button (unreliable on Xbox Series pads: USB reset on press)
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      ocs_topic: joy_teleop_direction

  9: # Left joystick press
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: software_e_stop
      initial: 'false'
      topic: gamepad_e_stop

  10: # Right joystick press
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: single_joint_mode

  11: # Button Share (only on newer Xbox controllers)
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      ocs_topic: joy_teleop_direction

# -------------------- All the axes can also be used as buttons if specified here --------------------
axis_buttons:
  left_stick_left:
    plugin: ''
    function: ''

  left_stick_right:
    plugin: ''
    function: ''

  left_stick_up:
    plugin: ''
    function: ''

  left_stick_down:
    plugin: ''
    function: ''

  left_trigger:
    plugin: ''
    function: ''

  right_stick_left:
    plugin: ''
    function: ''

  right_stick_right:
    plugin: ''
    function: ''

  right_stick_up:
    plugin: ''
    function: ''

  right_stick_down:
    plugin: ''
    function: ''

  right_trigger:
    plugin: ''
    function: ''

  cross_left:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: arm_group
      pose: back
      inverted_pose: front

  cross_right:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: arm_group
      pose: front
      inverted_pose: back

  cross_up:
    plugin: ''
    function: ''

  cross_down:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: arm_group
      pose: folded

axes:
  0: # Left joystick left/right
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: steer

  1: # Left joystick up/down
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: drive

  2: # LT
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_back_down

  3: # Right joystick left/right
    plugin: hector_gamepad_manager_plugins::VirtualCameraPlugin
    function: camera_pan

  4: # Right joystick up/down
    plugin: hector_gamepad_manager_plugins::VirtualCameraPlugin
    function: camera_tilt

  5: # RT
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_front_down

  6: # Cross left/right
    plugin: ''
    function: ''

  7: # Cross up/down
    plugin: ''
    function: ''

buttons:
  0: # Button A
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: slow

  1: # Button B
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    on_press:
      function: individual_front_flipper_control_mode
    on_double_press:
      function: sync_front_flippers

  2: # Button X
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    on_press:
      function: individual_back_flipper_control_mode
    on_double_press:
      function: sync_back_flippers

  3: # Button Y
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: fast

  4: # Button LB
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    on_press:
      function: flipper_back_up
    on_double_press:
      function: flipper_back_upright

  5: # Button RB
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    on_press:
      function: flipper_front_up
    on_double_press:
      function: flipper_front_upright

  6: # Button Back
    plugin: ''
    function: ''

  7: # Button Start
    plugin: ''
    function: ''

  8: # Button Guide (Manufacturer Button)
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      ocs_topic: joy_teleop_direction

  9: # Left joystick press
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: software_e_stop
      initial: 'false'
      topic: gamepad_e_stop


  10: # Right joystick press
    plugin: hector_gamepad_manager_plugins::VirtualCameraPlugin
    function: reset_camera

  11: # Button Share (only on newer Xbox controllers)
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      ocs_topic: joy_teleop_direction

  # -------------------- All the axes can also be used as buttons if specified here --------------------
  12: # Left joystick left
    plugin: ''
    function: ''

  13: # Left joystick right
    plugin: ''
    function: ''

  14: # Left joystick up
    plugin: ''
    function: ''

  15: # Left joystick down
    plugin: ''
    function: ''

  16: # LT
    plugin: ''
    function: ''

  17: # Right joystick left
    plugin: ''
    function: ''

  18: # Right joystick right
    plugin: ''
    function: ''

  19: # Right joystick up
    plugin: ''
    function: ''

  20: # Right joystick down
    plugin: ''
    function: ''

  21: # RT
    plugin: ''
    function: ''

  22: # Cross left
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: tub

  23: # Cross right
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: compact

  24: # Cross up
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: up

  25: # Cross down
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: flat

  7: # Cross up/down
    plugin: ''
    function: ''

buttons:
  0: # Button A
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: fast

  1: # Button B
    plugin: ''
    function: ''

  2: # Button X
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: slow

  3: # Button Y
    plugin: ''
    function: ''

  4: # Button LB
    plugin: ''
    function: ''

  5: # Button RB
    plugin: ''
    function: ''

  6: # Button Back
    plugin: ''
    function: ''

  7: # Button Start
    plugin: ''
    function: ''

  8: # Button Guide (Manufacturer Button)
    plugin: ''
    function: ''

  9: # Left joystick press
    plugin: hector_gamepad_manager_plugins::BatteryMonitorPlugin
    function: mute

  10: # Right joystick press
    plugin: ''
    function: ''

  11: # Button Share (only on newer Xbox controllers)
    plugin: ''
    function: ''


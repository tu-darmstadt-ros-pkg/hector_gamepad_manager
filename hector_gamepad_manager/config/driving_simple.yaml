    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: steer

  1: # Left joystick up/down
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: drive

  2: # LT
    plugin: ''
    function: ''

  3: # Right joystick left/right
    plugin: ''

# Plugin parameter set for the "athena" robot.
#
# Top-level keys are the snake_case plugin names; nested keys are the parameters each plugin
# declares (e.g. drive_plugin.max_linear_speed). Values are typed by inference with precedence
# bool > int > double > string. Parameters declared as double MUST be written with a decimal
# point (e.g. 1.0, not 1); otherwise they are inferred as int and the override type will not
# match the parameter's declared type.
#
# Selected by the `plugin_params` parameter (see the launch file) and applied as node parameter
# overrides at startup. May be switched at runtime via HectorGamepadManager::applyPluginParamSet.
drive_plugin:
  slow_factor: 0.5
  fast_factor: 1.5
  max_angular_speed: 0.5
  max_linear_speed: 0.5
flipper_plugin:
  flipper_back_factor: 1.0
  flipper_front_factor: 1.0
  button_speed_scaling: 0.75
  speed: 0.75
  standard_controller: flipper_trajectory_controller
  teleop_controller:
  - flipper_velocity_controller
  command_topic: flipper_velocity_controller/commands
manipulation_plugin:
  max_eef_linear_speed: 0.15
  max_eef_angular_speed: 0.25
  eef_twist_frame: gripper_grasp_main_link
  max_gripper_speed: 0.2
  max_drive_linear_speed: 0.5
  max_drive_angular_speed: 0.5
  twist_controller_name: moveit_twist_controller
  gripper_controller_name: gripper_position_controller
moveit_plugin:
  start_controllers:
  - arm_trajectory_controller
  - gripper_trajectory_controller
  - flipper_trajectory_controller
  max_velocity_scaling_factor: 0.1
  max_acceleration_scaling_factor: 0.1
  action_topic: fold_manager_action
battery_monitor_plugin:
  cell_voltage_fields:
  - cell_voltages_battery1_mv
  - cell_voltages_battery2_mv
  low_cell_threshold: 3500.0
  mute_duration_sec: 300.0
virtual_camera_plugin:
  back_camera_topic_name: back_wideangle/pinhole_back/set_transform
  front_camera_topic_name: front_wideangle/pinhole_front/set_transform
  pan_speed: 0.5
  tilt_speed: 0.5
  min_pan: -3.14
  max_pan: 3.14
  min_tilt: -3.14
  max_tilt: 3.14
  stick_hold_time: 1.0
  invert_y_axis: true

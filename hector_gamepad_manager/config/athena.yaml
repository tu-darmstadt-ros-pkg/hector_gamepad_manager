# This file maps the buttons to config switches
# If a button is pressed, the corresponding config will be loaded
# The buttons used here will block the button mappings for these buttons in ALL other configs
default_config: driving   # config used at startup
buttons:
  a:
    package: ''
    config: ''

  b:
    package: ''
    config: ''

  x:
    package: ''
    config: ''

  y:
    package: ''
    config: ''

  left_bumper:
    package: ''
    config: ''

  right_bumper:
    package: ''
    config: ''

  back:
    package: hector_gamepad_manager
    config: manipulation
    description: Switch to manipulation mode

  start:
    package: hector_gamepad_manager
    config: driving
    description: Switch to driving mode

  guide: # Button Guide (Manufacturer Button)
    package: ''
    config: ''

  left_stick_click:
    package: ''
    config: ''

  right_stick_click:
    package: ''
    config: ''

  share: # Button Share (only on newer Xbox controllers)
    package: ''
    config: ''

  dpad_left:
    package: ''
    config: ''

  dpad_right:
    package: ''
    config: ''

  dpad_up:
    package: ''
    config: ''

  dpad_down:
    package: ''
    config: ''


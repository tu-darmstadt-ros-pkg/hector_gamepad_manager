# This file maps the buttons to config switches
# If a button is pressed, the corresponding config will be loaded
# The buttons used here will block the button mappings for these buttons in ALL other configs
default_config: driving_simple   # config used at startup
buttons:
  0: # Button A
    package: ''
    config: ''

  1: # Button B
    package: ''
    config: ''

  2: # Button X
    package: ''
    config: ''

  3: # Button Y
    package: ''
    config: ''

  4: # Button LB
    package: ''
    config: ''

  5: # Button RB
    package: ''
    config: ''

  6: # Button Back
    package: ''
    config: ''

  7: # Button Start
    package: hector_gamepad_manager
    config: driving_simple

  8: # Button Guide (Manufacturer Button)
    package: ''
    config: ''

  9: # Left joystick press
    package: ''
    config: ''

  10: # Right joystick press
    package: ''
    config: ''

  11: # Button Share (only on newer Xbox controllers)
    package: ''
    config: ''

  # -------------------- All the axes can also be used as buttons if specified here --------------------
  12: # Left joystick left
    package: ''
    config: ''

  13: # Left joystick right
    package: ''
    config: ''

  14: # Left joystick up
    package: ''

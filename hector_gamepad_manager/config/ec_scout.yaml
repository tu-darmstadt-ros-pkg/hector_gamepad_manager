    package: ''
    config: ''

  19: # Right joystick up
    package: ''
    config: ''

  20: # Right joystick down
    package: ''
    config: ''

  21: # RT
    package: ''
    config: ''

  22: # Cross left
    package: ''
    config: ''

  23: # Cross right
    package: ''

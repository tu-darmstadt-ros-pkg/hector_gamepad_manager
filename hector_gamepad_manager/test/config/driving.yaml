axes:
  left_stick_x:
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: steer

  left_stick_y:
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: drive

  left_trigger:
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_back_down

  right_stick_x:
    plugin: ''
    function: ''

  right_stick_y:
    plugin: ''
    function: ''

  right_trigger:
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_front_down

buttons:
  a:
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: fast

  b:
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: individual_back_flipper_control_mode

  x:
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: slow

  y:
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: individual_front_flipper_control_mode

  left_bumper:
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_back_up

  right_bumper:
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_front_up

  back:
    plugin: ''
    function: ''

  start:
    plugin: ''
    function: ''

  guide: # Button Guide (Manufacturer Button) - fallback for pads without a Share button
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      initial: 'false'

  left_stick_click:
    plugin: hector_gamepad_manager_plugins::BatteryMonitorPlugin
    function: mute

  right_stick_click:
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: software_e_stop
      initial: 'false'
      topic: gamepad_e_stop

  share: # Button Share (only on newer Xbox controllers)
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      initial: 'false'

  dpad_left:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: tub

  dpad_right:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: compact

  dpad_up:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: up

  dpad_down:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: flat

# -------------------- All the axes can also be used as buttons if specified here --------------------
axis_buttons:
  left_stick_left:
    plugin: ''
    function: ''

  left_stick_right:
    plugin: ''
    function: ''

  left_stick_up:
    plugin: ''
    function: ''

  left_stick_down:
    plugin: ''
    function: ''

  left_trigger:
    plugin: ''
    function: ''

  right_stick_left:
    plugin: ''
    function: ''

  right_stick_right:
    plugin: ''
    function: ''

  right_stick_up:
    plugin: ''
    function: ''

  right_stick_down:
    plugin: ''
    function: ''

  right_trigger:
    plugin: ''
    function: ''

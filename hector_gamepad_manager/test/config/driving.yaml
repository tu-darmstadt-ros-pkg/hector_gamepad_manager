axes:
  0: # Left joystick left/right
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: steer

  1: # Left joystick up/down
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: drive

  2: # LT
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_back_down

  3: # Right joystick left/right
    plugin: ''
    function: ''

  4: # Right joystick up/down
    plugin: ''
    function: ''

  5: # RT
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_front_down

  6: # Cross left/right
    plugin: ''
    function: ''

  7: # Cross up/down
    plugin: ''
    function: ''

buttons:
  0: # Button A
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: fast

  1: # Button B
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: individual_back_flipper_control_mode

  2: # Button X
    plugin: hector_gamepad_manager_plugins::DrivePlugin
    function: slow

  3: # Button Y
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: individual_front_flipper_control_mode

  4: # Button LB
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_back_up

  5: # Button RB
    plugin: hector_gamepad_manager_plugins::FlipperPlugin
    function: flipper_front_up

  6: # Button Back
    plugin: ''
    function: ''

  7: # Button Start
    plugin: ''
    function: ''

  8: # Button Guide (Manufacturer Button) - fallback for pads without a Share button
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      initial: 'false'

  9: # Left joystick press
    plugin: hector_gamepad_manager_plugins::BatteryMonitorPlugin
    function: mute

  10: # Right joystick press
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: software_e_stop
      initial: 'false'
      topic: gamepad_e_stop

  11: # Button Share (only on newer Xbox controllers)
    plugin: hector_gamepad_manager_plugins::BlackboardPlugin
    function: toggle
    args:
      name: invert_steering
      initial: 'false'

# -------------------- All the axes can also be used as buttons if specified here --------------------
axis_buttons:
  left_stick_left:
    plugin: ''
    function: ''

  left_stick_right:
    plugin: ''
    function: ''

  left_stick_up:
    plugin: ''
    function: ''

  left_stick_down:
    plugin: ''
    function: ''

  left_trigger:
    plugin: ''
    function: ''

  right_stick_left:
    plugin: ''
    function: ''

  right_stick_right:
    plugin: ''
    function: ''

  right_stick_up:
    plugin: ''
    function: ''

  right_stick_down:
    plugin: ''
    function: ''

  right_trigger:
    plugin: ''
    function: ''

  cross_left:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: tub

  cross_right:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: compact

  cross_up:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: up

  cross_down:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: go_to_pose
    args:
      group: flipper_group
      pose: flat

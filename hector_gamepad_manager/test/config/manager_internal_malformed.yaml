# Test-only config that exercises malformed-entry handling. The manager should log warnings
# and skip the bad entries rather than throwing or registering a broken mapping.
axes:
  left_stick_x: {plugin: '', function: ''}
  left_stick_y: {plugin: '', function: ''}
  left_trigger: {plugin: '', function: ''}
  right_stick_x: {plugin: '', function: ''}
  right_stick_y: {plugin: '', function: ''}
  right_trigger: {plugin: '', function: ''}
buttons:
  # Button A: legacy-format entry with plugin: but no function: — must be skipped, not crash.
  a:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
  # Button B: new-format entry with no on_press and only on_hold/on_release — must be skipped.
  b:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    on_hold: {function: probe_hold}
    on_release: {function: probe_release}
  # Button X: a valid legacy entry, so the rest of the config still loads.
  x:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: probe
  # Button Y: new-format entry with on_double_press but no on_press — must be skipped because
  # the timeout-flush path would otherwise dispatch handlePress("") on a single tap.
  y:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    on_double_press: {function: probe_double}
  left_bumper: {plugin: '', function: ''}
  # Button RB: legacy entry with a description: but no function: — description must not make it
  # valid; still skipped.
  right_bumper:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    description: Should be ignored
  back: {plugin: '', function: ''}
  start: {plugin: '', function: ''}
  guide: {plugin: '', function: ''}
  left_stick_click: {plugin: '', function: ''}
  right_stick_click: {plugin: '', function: ''}
  share: {plugin: '', function: ''}

  dpad_left: {plugin: '', function: ''}
  dpad_right: {plugin: '', function: ''}
  dpad_up: {plugin: '', function: ''}
  dpad_down: {plugin: '', function: ''}

axis_buttons:
  left_stick_left: {plugin: '', function: ''}
  left_stick_right: {plugin: '', function: ''}
  left_stick_up: {plugin: '', function: ''}
  left_stick_down: {plugin: '', function: ''}
  left_trigger: {plugin: '', function: ''}
  right_stick_left: {plugin: '', function: ''}
  right_stick_right: {plugin: '', function: ''}
  right_stick_up: {plugin: '', function: ''}
  right_stick_down: {plugin: '', function: ''}
  right_trigger: {plugin: '', function: ''}

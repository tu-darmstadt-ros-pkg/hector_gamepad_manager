axes:
  left_stick_x:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_left_right

  left_stick_y:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_up_down

  left_trigger:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_backward

  right_stick_x:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_yaw

  right_stick_y:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_pitch

  right_trigger:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: move_forward

buttons:
  a:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: nullspace_mode

  b:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: hold_mode

  x:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: gripper_close

  y:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: gripper_open

  left_bumper:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_roll_counter_clockwise

  right_bumper:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: rotate_roll_clockwise

  back:
    plugin: ''
    function: ''

  start:
    plugin: ''
    function: ''

  guide:
    plugin: ''
    function: ''

  left_stick_click:
    plugin: hector_gamepad_manager_plugins::BatteryMonitorPlugin
    function: mute

  right_stick_click:
    plugin: hector_gamepad_manager_plugins::ManipulationPlugin
    function: single_joint_mode

  share: # Button Share (only on newer Xbox controllers)
    plugin: ''
    function: ''

  dpad_left:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: arm_group/back

  dpad_right:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: arm_group/front

  dpad_up:
    plugin: ''
    function: ''

  dpad_down:
    plugin: hector_gamepad_manager_plugins::MoveitPlugin
    function: arm_group/folded

# -------------------- All the axes can also be used as buttons if specified here --------------------
axis_buttons:
  left_stick_left:
    plugin: ''
    function: ''

  left_stick_right:
    plugin: ''
    function: ''

  left_stick_up:
    plugin: ''
    function: ''

  left_stick_down:
    plugin: ''
    function: ''

  left_trigger:
    plugin: ''
    function: ''

  right_stick_left:
    plugin: ''
    function: ''

  right_stick_right:
    plugin: ''
    function: ''

  right_stick_up:
    plugin: ''
    function: ''

  right_stick_down:
    plugin: ''
    function: ''

  right_trigger:
    plugin: ''
    function: ''

# Test-only config for manager internal logic tests.
# Only bound controls are listed: an unlisted one behaves exactly like one written with an empty
# plugin, and the catalog of what exists lives in gamepad_buttons.hpp.
axes:
  left_stick_x:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: axis
buttons:
  a:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: probe
  share: # Button Share (only on newer Xbox controllers)
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: share
  paddle1: # Only some pads have paddles; they map 1:1 like any other button
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: extra
  dpad_up:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: dpad

axis_buttons:
  left_stick_left:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: virtual
  left_trigger:
    plugin: hector_gamepad_manager_plugins::TestProbePlugin
    function: trigger_button

# Test-only config switch map exercising out-of-range button-id handling.
# Button 7 loads the config; button 99 is out of range and must be skipped (not written into the
# fixed-size config_switch_button_mapping array).
default_config: manager_internal_oob
buttons:
  7: {package: hector_gamepad_manager, config: manager_internal_oob}
  99: {package: hector_gamepad_manager, config: manager_internal_oob}

launch:
- arg:
    # Meta Config File that determines which buttons activate which config
    name: config_name
    default: athena
- arg:
    name: robot_namespace
    default: athena
- arg:
    name: ocs_namespace
    default: ocs
- arg:
    # Name of the plugin-param set in config/plugin_params/<plugin_params>.yaml
    name: plugin_params
    default: $(var config_name)

- node:
    pkg: hector_gamepad_manager
    exec: hector_gamepad_manager_node
    name: $(anon hector_gamepad_manager_node)
    output: screen
    param:
    - name: config_name
      value: $(var config_name)
    - name: robot_namespace
      value: $(var robot_namespace)
    - name: ocs_namespace
      value: $(var ocs_namespace)
    - name: plugin_params
      value: $(var plugin_params)
